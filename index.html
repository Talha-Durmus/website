<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Bir Sorum Var ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 40px 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.93);
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 2;
        }

        .heart {
            font-size: 55px;
            animation: heartbeat 1.2s infinite;
        }

        h1 {
            color: #e63956;
            font-size: 30px;
            margin: 25px 0 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            min-height: 70px;
        }

        button {
            border: none;
            padding: 15px 28px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition:
                transform 0.35s ease,
                left 0.35s ease,
                top 0.35s ease,
                width 0.4s ease,
                height 0.4s ease,
                border-radius 0.4s ease;
        }

        #yesBtn {
            background: #e63956;
            color: white;
            position: relative;
            z-index: 10;
        }

        #noBtn {
            background: #ddd;
            color: #333;
            position: relative;
            z-index: 20;
        }

        #noBtn.running {
            position: fixed;
        }

        .hidden {
            display: none;
        }

        #message {
            color: #444;
            line-height: 1.8;
            font-size: 18px;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.18);
            }
        }

        /* Kalpler */

        .floating-heart {
            position: fixed;
            bottom: -30px;
            font-size: 20px;
            animation: floatUp linear forwards;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0);
                opacity: 1;
            }

            to {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }
    </style>
</head>


<body>

    <!-- SORU EKRANI -->

    <div class="container" id="questionPage">

        <div class="heart">❤️</div>

        <h1>
            Konuşmaya devam edelim mi?
        </h1>

        <div class="buttons">

            <button id="yesBtn">
                Evet ❤️
            </button>

            <button id="noBtn">
                Hayır
            </button>

        </div>

    </div>


    <!-- MESAJ EKRANI -->

    <div class="container hidden" id="messagePage">

        <div class="heart">❤️</div>

        <h1>
            Teşekkür ederim ❤️
        </h1>

        <div id="message">

            <p>
                Buraya kendi mesajını yazabilirsin.
            </p>

            <p>
                Seni kırdıysam gerçekten özür dilerim.
                Konuşmaya devam etmek istemen benim için
                çok değerli.
            </p>

            <p>
                ❤️
            </p>

        </div>

    </div>


    <script>

        const yesBtn = document.getElementById("yesBtn");
        const noBtn = document.getElementById("noBtn");

        const questionPage = document.getElementById("questionPage");
        const messagePage = document.getElementById("messagePage");

        let noClicks = 0;


        /*
        ==========================================
        EVET BUTONUNA BASILDIĞINDA
        ==========================================
        */

        yesBtn.addEventListener("click", function () {

            questionPage.classList.add("hidden");

            messagePage.classList.remove("hidden");

        });


        /*
        ==========================================
        HAYIR BUTONUNA BASILDIĞINDA
        ==========================================
        */

        noBtn.addEventListener("click", function (event) {

            event.preventDefault();

            noClicks++;

            growYesButton();

            moveNoButton();

            changeNoText();

        });


        /*
        ==========================================
        EVET BUTONUNU BÜYÜT
        ==========================================
        */

        function growYesButton() {

            /*
            Her tıklamada biraz daha büyüyecek.
            */

            const sizes = [
                18,
                21,
                25,
                30,
                36,
                44,
                55,
                70
            ];

            const index = Math.min(noClicks, sizes.length - 1);

            yesBtn.style.fontSize = sizes[index] + "px";


            /*
            6. tıklamadan sonra ekranı
            kaplamaya başlasın.
            */

            if (noClicks >= 6) {

                const progress = Math.min(
                    (noClicks - 5) / 3,
                    1
                );

                const width =
                    180 +
                    (window.innerWidth * 1.5 - 180) * progress;

                const height =
                    70 +
                    (window.innerHeight * 1.5 - 70) * progress;

                yesBtn.style.position = "fixed";

                yesBtn.style.left = "50%";
                yesBtn.style.top = "50%";

                yesBtn.style.transform =
                    "translate(-50%, -50%)";

                yesBtn.style.width = width + "px";
                yesBtn.style.height = height + "px";

                yesBtn.style.borderRadius = "50%";

                yesBtn.style.fontSize =
                    (30 + progress * 40) + "px";
            }


            /*
            8. tıklamadan sonra Hayır tamamen kaybolsun.
            */

            if (noClicks >= 8) {

                noBtn.style.display = "none";

                yesBtn.style.width = "120vw";
                yesBtn.style.height = "120vh";

                yesBtn.style.borderRadius = "0";

                yesBtn.style.fontSize = "42px";

            }

        }


        /*
        ==========================================
        HAYIR BUTONUNU KAÇIR
        ==========================================
        */

        function moveNoButton() {

            /*
            Önce fixed konuma geçiriyoruz.
            Böylece ekranın herhangi bir yerine
            kaçabilir.
            */

            noBtn.classList.add("running");

            const buttonWidth = noBtn.offsetWidth;
            const buttonHeight = noBtn.offsetHeight;

            const padding = 20;

            const maxX =
                window.innerWidth -
                buttonWidth -
                padding;

            const maxY =
                window.innerHeight -
                buttonHeight -
                padding;

            let randomX =
                Math.random() * maxX;

            let randomY =
                Math.random() * maxY;


            /*
            Evet butonunun üstüne kaçmasın.
            */

            const yesRect = yesBtn.getBoundingClientRect();

            const overlaps =
                randomX < yesRect.right &&
                randomX + buttonWidth > yesRect.left &&
                randomY < yesRect.bottom &&
                randomY + buttonHeight > yesRect.top;


            if (overlaps) {

                randomX =
                    Math.random() * maxX;

                randomY =
                    Math.random() * maxY;

            }


            noBtn.style.left = randomX + "px";
            noBtn.style.top = randomY + "px";

        }


        /*
        ==========================================
        HAYIR YAZISINI DEĞİŞTİR
        ==========================================
        */

        function changeNoText() {

            const texts = [

                "Hayır",

                "Emin misin? 😢",

                "Gerçekten mi?",

                "Bir daha düşün 🥺",

                "Olmaz mı? ❤️",

                "Lütfen 🥺",

                "Son kararın mı?",

                "Artık kaçamam 😭"

            ];

            const index =
                Math.min(noClicks, texts.length - 1);

            noBtn.textContent = texts[index];

        }


        /*
        ==========================================
        ARKA PLANDA UÇAN KALPLER
        ==========================================
        */

        function createHeart() {

            const heart =
                document.createElement("div");

            heart.className = "floating-heart";

            heart.textContent =
                Math.random() > 0.5 ? "❤️" : "💕";

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.animationDuration =
                (4 + Math.random() * 4) + "s";

            heart.style.fontSize =
                (15 + Math.random() * 20) + "px";

            document.body.appendChild(heart);

            setTimeout(function () {

                heart.remove();

            }, 8000);

        }


        setInterval(createHeart, 700);

    </script>

</body>
</html>
