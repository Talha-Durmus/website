<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bir Sorum Var ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 40px 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #e63956;
            font-size: 32px;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 60px;
        }

        button {
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        #yesBtn {
            background: #e63956;
            color: white;
        }

        #yesBtn:hover {
            transform: scale(1.1);
        }

        #noBtn {
            background: #ddd;
            color: #333;
        }

        .hidden {
            display: none;
        }

        #message {
            color: #444;
            line-height: 1.8;
            font-size: 18px;
        }

        .heart {
            font-size: 55px;
            animation: heartbeat 1.2s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }
    </style>
</head>

<body>

    <div class="container" id="questionPage">

        <div class="heart">❤️</div>

        <h1>
            Konuşmaya devam edelim mi?
        </h1>

        <div class="buttons">

            <button id="yesBtn">
                Evet ❤️
            </button>

            <button id="noBtn">
                Hayır
            </button>

        </div>

    </div>


    <div class="container hidden" id="messagePage">

        <div class="heart">❤️</div>

        <h1>Teşekkür ederim ❤️</h1>

        <div id="message">

            <p>
                Buraya söylemek istediğin özür ve teşekkür
                mesajını yazacağız.
            </p>

            <p>
                Seni kırdıysam gerçekten özür dilerim.
                Konuşmaya devam etmek istemen benim için
                çok değerli.
            </p>

        </div>

    </div>


    <script>

        const yesBtn = document.getElementById("yesBtn");
        const noBtn = document.getElementById("noBtn");

        const questionPage = document.getElementById("questionPage");
        const messagePage = document.getElementById("messagePage");


        // EVET BUTONU

        yesBtn.addEventListener("click", function() {

            questionPage.classList.add("hidden");

            messagePage.classList.remove("hidden");

        });


        // HAYIR BUTONU

        noBtn.addEventListener("mouseenter", function() {

            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            noBtn.style.position = "fixed";
            noBtn.style.left = randomX + "px";
            noBtn.style.top = randomY + "px";

        });

    </script>

</body>
</html>
